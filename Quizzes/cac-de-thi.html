<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuizMaster – Các Đề Thi</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236366F1'%3E%3Cpath d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.93.93c-.75.75-1.14 1.72-1.14 2.82v.5h-2v-.5c0-1.6.62-3.07 1.75-4.2l1.32-1.32c.38-.38.6-.9.6-1.45 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@400;500;600;700;800;900&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="cac-de-thi.css">
</head>
<body>

<div id="loading-screen">
  <div class="loading-logo">Quiz<span>Master</span></div>
  <div class="loading-bar"><div class="loading-fill"></div></div>
</div>

<!-- TOP NAV -->
<nav id="top-nav">
  <div class="nav-logo" onclick="window.location.href='quizzes.html'">
    <i class="fas fa-brain"></i><span class="nav-logo-text">Quiz<span style="color:var(--accent2)">Master</span></span>
  </div>
  <div class="nav-links">
    <button class="nav-btn" id="nav-home" onclick="window.location.href='quizzes.html'"><i class="fas fa-home"></i><span class="nav-label"> Trắc nghiệm</span></button>
    <button class="nav-btn" id="nav-tu-luan" onclick="window.location.href='tu-luan.html'"><i class="fas fa-pen-nib"></i><span class="nav-label"> Tự luận</span></button>
    <button class="nav-btn active" id="nav-links"><i class="fas fa-link"></i><span class="nav-label"> Các đề thi</span></button>
    <button class="nav-btn" id="nav-add" onclick="window.location.href='quizzes.html'"><i class="fas fa-plus"></i><span class="nav-label"> Thêm mới</span></button>
    <button class="nav-btn" id="nav-settings" onclick="window.location.href='quizzes.html'"><i class="fas fa-palette"></i><span class="nav-label"> Cài đặt</span></button>
  </div>
</nav>

<!-- LINKS / CÁC ĐỀ THI PAGE -->
<div class="page active" id="page-links">
  <div class="links-page-wrap">
    <div class="links-hero">
      <h1 class="links-hero-title"><i class="fas fa-link" style="color:var(--accent2)"></i> Các <span>Đề Thi</span></h1>
      <p class="links-hero-sub">Lưu và truy cập nhanh các đề thi, tài liệu ôn tập</p>
      <div class="links-stats-row" id="links-stats-row">
        <div class="stat-badge"><i class="fas fa-link"></i><span id="links-total-count">0</span> đường link</div>
        <div class="stat-badge" style="color:var(--accent2)"><i class="fas fa-check-circle"></i><span id="links-done-count">0</span> đã làm xong</div>
      </div>
      <!-- Filter tags -->
      <div class="links-filter-row" id="links-filter-row">
        <button class="link-tag-filter active" data-tag="all" onclick="filterLinks('all')">
          <i class="fas fa-th-large"></i> Tất cả
        </button>
        <button class="link-tag-filter" data-tag="toán" onclick="filterLinks('toán')">
          <span class="tag-dot" style="background:#6c63ff"></span> Toán
        </button>
        <button class="link-tag-filter" data-tag="lý" onclick="filterLinks('lý')">
          <span class="tag-dot" style="background:#00d4aa"></span> Lý
        </button>
        <button class="link-tag-filter" data-tag="hóa" onclick="filterLinks('hóa')">
          <span class="tag-dot" style="background:#ff6b6b"></span> Hóa
        </button>
        <button class="link-tag-filter" data-tag="anh" onclick="filterLinks('anh')">
          <span class="tag-dot" style="background:#ffd93d"></span> Anh
        </button>
        <button class="link-tag-filter" data-tag="sinh" onclick="filterLinks('sinh')">
          <span class="tag-dot" style="background:#00e676"></span> Sinh
        </button>
        <button class="link-tag-filter" data-tag="văn" onclick="filterLinks('văn')">
          <span class="tag-dot" style="background:#ff9800"></span> Văn
        </button>
        <button class="link-tag-filter" data-tag="khác" onclick="filterLinks('khác')">
          <span class="tag-dot" style="background:#90a4ae"></span> Khác
        </button>
      </div>
      <!-- Sort bar removed — dùng kéo thả -->
    </div>

    <div class="links-sort-mode-banner" id="links-sort-mode-banner">
      <i class="fas fa-arrows-alt"></i> Chế độ sắp xếp — Kéo thả để thay đổi thứ tự &nbsp;
      <button onclick="exitLinkSortMode()" style="margin-left:auto;padding:3px 10px;border-radius:5px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer;font-size:.78rem">Xong</button>
    </div>

    <div class="links-grid" id="links-grid">
      <div class="links-empty-state" id="links-empty-state">
        <i class="fas fa-link"></i>
        <h3>Chưa có đường link nào</h3>
        <p>Nhấn nút <strong>+</strong> bên dưới để thêm link đầu tiên</p>
      </div>
    </div>

    <!-- FAB Add Button -->
    <button class="links-fab" id="links-fab" onclick="openLinkModal()">
      <i class="fas fa-plus"></i>
    </button>
    <!-- Drag Sort Button -->
    <button class="drag-sort-btn" id="links-drag-sort-btn" onclick="toggleLinkSortMode()" style="position:fixed;bottom:24px;right:96px;z-index:200">
      <i class="fas fa-sort"></i> Sắp xếp
    </button>
  </div>
</div>

<!-- LINK MODAL (Add/Edit) -->
<div class="link-modal-overlay" id="link-modal-overlay" onclick="closeLinkModalOutside(event)">
  <div class="link-modal" id="link-modal">
    <div class="link-modal-header">
      <h3 id="link-modal-title"><i class="fas fa-link"></i> Thêm đường link</h3>
      <button class="link-modal-close" onclick="closeLinkModal()"><i class="fas fa-times"></i></button>
    </div>
    <div class="form-group" style="margin-bottom:14px">
      <label style="display:block;font-size:.82rem;font-weight:600;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em">Tên đường link *</label>
      <input type="text" class="form-input" id="link-name-input" placeholder="VD: Tài liệu Toán lớp 12">
    </div>
    <div class="form-group" style="margin-bottom:14px">
      <label style="display:block;font-size:.82rem;font-weight:600;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em">URL *</label>
      <input type="url" class="form-input" id="link-url-input" placeholder="https://...">
    </div>
    <div class="form-group" style="margin-bottom:20px">
      <label style="display:block;font-size:.82rem;font-weight:600;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em">Phân loại</label>
      <div class="link-tag-picker" id="link-tag-picker">
        <button class="link-tag-pick-btn" data-tag="toán" onclick="selectLinkTag('toán')"><span class="tag-dot" style="background:#6c63ff"></span> Toán</button>
        <button class="link-tag-pick-btn" data-tag="lý" onclick="selectLinkTag('lý')"><span class="tag-dot" style="background:#00d4aa"></span> Lý</button>
        <button class="link-tag-pick-btn" data-tag="hóa" onclick="selectLinkTag('hóa')"><span class="tag-dot" style="background:#ff6b6b"></span> Hóa</button>
        <button class="link-tag-pick-btn" data-tag="anh" onclick="selectLinkTag('anh')"><span class="tag-dot" style="background:#ffd93d"></span> Anh</button>
        <button class="link-tag-pick-btn" data-tag="sinh" onclick="selectLinkTag('sinh')"><span class="tag-dot" style="background:#00e676"></span> Sinh</button>
        <button class="link-tag-pick-btn" data-tag="văn" onclick="selectLinkTag('văn')"><span class="tag-dot" style="background:#ff9800"></span> Văn</button>
        <button class="link-tag-pick-btn" data-tag="khác" onclick="selectLinkTag('khác')"><span class="tag-dot" style="background:#90a4ae"></span> Khác</button>
      </div>
    </div>
    <div style="display:flex;gap:10px">
      <button class="link-modal-cancel" onclick="closeLinkModal()">Huỷ</button>
      <button class="link-modal-save" id="link-modal-save-btn" onclick="saveLinkItem()"><i class="fas fa-save"></i> Lưu</button>
    </div>
  </div>
</div>

<!-- CONFIRM MODAL -->
<div class="modal-overlay" id="confirm-modal">
  <div class="modal">
    <h3 id="modal-title">Xác nhận</h3>
    <p id="modal-desc"></p>
    <div class="modal-btns">
      <button class="modal-btn" onclick="closeModal()">Hủy</button>
      <button class="modal-btn danger" id="modal-confirm-btn">Xóa</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<!-- APP JS -->
<script type="module" src="cac-de-thi.js"></script>
</body>
</html>
