<!-- MathJax for proper fraction rendering -->
<script>
window.MathJax = {
  tex: { inlineMath: [['\\(','\\)'],['$','$']], displayMath: [['\\[','\\]']] },
  options: { skipHtmlTags: ['script','noscript','style','textarea'] },
  startup: { typeset: false }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" async id="MathJax-script"></script>
</head>
<body>

<!-- TOP NAV (same as quizzes) -->
<nav id="top-nav">
  <div class="nav-logo" onclick="window.location.href='quizzes.html'">
    <i class="fas fa-brain"></i><span class="nav-logo-text">Quiz<span style="color:var(--accent2)">Master 1.2</span></span>
  </div>
  <div class="nav-links">
    <button class="nav-btn" onclick="window.location.href='quizzes.html'"><i class="fas fa-home"></i><span class="nav-label"> Trắc nghiệm</span></button>
    <button class="nav-btn" onclick="window.location.href='tu-luan.html'"><i class="fas fa-pen-nib"></i><span class="nav-label"> Tự luận</span></button>

  </div>

<!-- MAIN CONTENT -->
<div class="lt-wrap">

    <h1><i class="fas fa-square-root-alt" style="color:var(--accent2)"></i> Luyện <span>Toán</span> lớp 9</h1>
    <p>Bài tập tương tác · AI sinh đề ngẫu nhiên · 6 đáp án mỗi câu</p>
    <div class="lt-score-row">
      <div class="lt-score-chip" id="score-chip"><i class="fas fa-star"></i> <span id="score-text">0 / 0</span></div>
      <div class="lt-dots" id="dots"></div>
    </div>
  </div>

  <!-- TOPIC TABS -->
  <div class="lt-tabs" id="lt-tabs"></div>

  <!-- AI SUBTYPE PICKER (only for tinh-toan) -->
  <div class="lt-subtype-row" id="lt-subtype-row" style="display:none"></div>

  <!-- EXERCISE AREA -->
  <div id="lt-area"></div>

</div>

<div id="toast"></div>

<script src="luyen-toan.js"></script>
