<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luyện Toán – QuizMaster</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236366F1'%3E%3Cpath d='M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14l-5-5 1.41-1.41L12 14.17l7.59-7.59L21 8l-9 9z'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@400;500;600;700;800;900&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="quizzes.css">
<link rel="stylesheet" href="luyen-toan.css">
<script>
window.MathJax = {
  tex: { inlineMath: [['\\(','\\)'],['$','$']], displayMath: [['\\[','\\]']] },
  options: { skipHtmlTags: ['script','noscript','style','textarea'] },
  startup: { typeset: false }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" async id="MathJax-script"></script>
</head>
<body>

<nav id="top-nav">
  <div class="nav-logo" onclick="window.location.href='quizzes.html'">
    <i class="fas fa-brain"></i><span class="nav-logo-text">Quiz<span style="color:var(--accent2)">Master 1.2</span></span>
  </div>
  <div class="nav-links">
    <button class="nav-btn" onclick="window.location.href='quizzes.html'"><i class="fas fa-home"></i><span class="nav-label"> Trắc nghiệm</span></button>
    <button class="nav-btn" onclick="window.location.href='tu-luan.html'"><i class="fas fa-pen-nib"></i><span class="nav-label"> Tự luận</span></button>
    <button class="nav-btn" onclick="window.location.href='cac-de-thi.html'"><i class="fas fa-link"></i><span class="nav-label"> Các đề thi</span></button>
    <button class="nav-btn active"><i class="fas fa-square-root-alt"></i><span class="nav-label"> Luyện Toán</span></button>
  </div>
</nav>

<div class="lt-wrap">

  <!-- HEADER -->
  <div class="lt-hero">
    <h1><i class="fas fa-square-root-alt" style="color:var(--accent2)"></i> Luyện <span>Toán</span> lớp 9</h1>
    <p>Bài tập tương tác · 600+ câu ngẫu nhiên · 6 đáp án mỗi câu</p>
    <div class="lt-score-row">
      <div class="lt-score-chip" id="score-chip"><i class="fas fa-star"></i> <span id="score-text">0 / 0</span></div>
      <div class="lt-dots" id="dots"></div>
      <button class="lt-icon-btn" onclick="window.showHistoryModal()" title="Xem lịch sử làm bài"><i class="fas fa-history"></i></button>
      <button class="lt-icon-btn" onclick="window.resetSession()" title="Làm lại từ đầu"><i class="fas fa-redo"></i></button>
      <button class="lt-icon-btn" onclick="window.openTimerSettings()" title="Cài đặt thời gian (Admin)"><i class="fas fa-cog"></i></button>
    </div>
  </div>

  <!-- TABS HÀNG TRÊN (2 phút) -->
  <div class="lt-tab-group-label"><i class="fas fa-clock"></i> Cơ bản · <span id="easy-time-label">2 phút</span>/câu</div>
  <div class="lt-tabs" id="lt-tabs-easy"></div>

  <!-- TABS HÀNG DƯỚI (5 phút) -->
  <div class="lt-tab-group-label hard"><i class="fas fa-fire"></i> Nâng cao · <span id="hard-time-label">5 phút</span>/câu</div>
  <div class="lt-tabs" id="lt-tabs-hard"></div>

  <!-- EXERCISE AREA -->
  <div id="lt-area"></div>

</div>

<!-- HISTORY MODAL -->
<div class="lt-modal-overlay" id="lt-history-modal" onclick="if(event.target===this)window.closeHistoryModal()">
  <div class="lt-modal">
    <div class="lt-modal-header">
      <div class="lt-modal-title"><i class="fas fa-history"></i> Lịch sử phiên làm bài</div>
      <button class="lt-modal-close" onclick="window.closeHistoryModal()"><i class="fas fa-times"></i></button>
    </div>
    <p style="font-size:.8rem;color:var(--text3);margin-bottom:12px"><i class="fas fa-info-circle"></i> Lịch sử tự xóa khi tải lại trang (session). Cần admin để xóa thủ công.</p>
    <div id="lt-history-entries"></div>
    <button class="lt-clear-btn" onclick="window.promptClearHistory()"><i class="fas fa-trash-alt"></i> Xóa lịch sử (admin)</button>
  </div>
</div>

<!-- TIMER SETTINGS MODAL (Admin) -->
<div class="lt-modal-overlay" id="lt-timer-modal" onclick="if(event.target===this)window.closeTimerModal()">
  <div class="lt-modal lt-pwd-modal-inner">
    <div class="lt-modal-header">
      <div class="lt-modal-title"><i class="fas fa-stopwatch"></i> Cài đặt thời gian</div>
      <button class="lt-modal-close" onclick="window.closeTimerModal()"><i class="fas fa-times"></i></button>
    </div>
    <div class="lt-timer-setting-row">
      <label>Tab Cơ bản (giây):</label>
      <input type="number" id="lt-easy-secs" min="30" max="600" value="120" class="lt-timer-input">
    </div>
    <div class="lt-timer-setting-row">
      <label>Tab Nâng cao (giây):</label>
      <input type="number" id="lt-hard-secs" min="60" max="1200" value="300" class="lt-timer-input">
    </div>
    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="lt-pwd-confirm-btn" style="flex:1;padding:9px" onclick="window.saveTimerSettings()"><i class="fas fa-save"></i> Lưu</button>
      <button class="lt-modal-cancel" onclick="window.closeTimerModal()">Hủy</button>
    </div>
  </div>
</div>

<!-- ADMIN PASSWORD MODAL -->
<div class="lt-modal-overlay" id="lt-pwd-modal" onclick="if(event.target===this)window.closeAdminModal()">
  <div class="lt-modal lt-pwd-modal-inner">
    <div class="lt-modal-header">
      <div class="lt-modal-title"><i class="fas fa-shield-alt"></i> <span id="lt-pwd-title">Xác nhận Admin</span></div>
      <button class="lt-modal-close" onclick="window.closeAdminModal()"><i class="fas fa-times"></i></button>
    </div>
    <p id="lt-pwd-desc" style="font-size:.85rem;color:var(--text2);margin-bottom:14px"></p>
    <div style="display:flex;gap:8px">
      <input type="password" id="lt-pwd-input" class="lt-pwd-input" placeholder="Mật khẩu..." onkeydown="if(event.key==='Enter')window.confirmAdminPwd()">
      <button class="lt-pwd-confirm-btn" onclick="window.confirmAdminPwd()"><i class="fas fa-unlock"></i></button>
    </div>
    <div id="lt-pwd-error" class="lt-pwd-error"></div>
    <button class="lt-modal-cancel" onclick="window.closeAdminModal()" style="margin-top:12px">Hủy</button>
  </div>
</div>

<div id="toast"></div>

<script src="questions-bank.js"></script>
<script src="luyen-toan.js"></script>
</body>
</html>
