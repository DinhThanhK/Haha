<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Tracker</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23FFD700'%3E%3Cpath d='M19 3h-1V2c0-.55-.45-1-1-1s-1 .45-1 1v1H8V2c0-.55-.45-1-1-1S6 1.45 6 2v1H5C3.89 3 3 3.89 3 5v14c0 1.11.89 2 2 2h14c1.11 0 2-.89 2-2V5c0-1.11-.89-2-2-2zm-1 16H6V8h12v11zm-4-7h-4v-1h4v1zm0 3h-4v-1h4v1z'/%3E%3C/svg%3E">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
body {
    font-family: 'Segoe UI', Arial, sans-serif;
    margin: 0;
    padding: 20px;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    color: #e0e0e0;
    min-height: 100vh;
}
.container {
    max-width: 2000px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
}
.panels {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
}
.input-section, .textarea-section {
    flex: 1;
    min-width: 300px;
    max-height: 500px;
    background: rgba(42, 42, 42, 0.95);
    backdrop-filter: blur(10px);
    border-radius: 15px;
    padding: 25px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    border: 1px solid rgba(255, 255, 255, 0.1);
    transition: all 0.3s ease;
}
.input-section:hover, .textarea-section:hover {
    transform: translateY(-5px);
    box-shadow: 0 12px 40px rgba(0, 123, 255, 0.3);
}
.chart-section {
    background: rgba(42, 42, 42, 0.95);
    backdrop-filter: blur(10px);
    border-radius: 15px;
    padding: 25px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    border: 1px solid rgba(255, 255, 255, 0.1);
    transition: all 0.3s ease;
}
.chart-section:hover {
    box-shadow: 0 12px 40px rgba(255, 215, 0, 0.2);
}
h2 {
    margin: 0 0 20px;
    color: #ffffff;
    font-size: 1.6em;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    padding-bottom: 10px;
    border-bottom: 2px solid rgba(102, 126, 234, 0.3);
}
.input-group {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 15px;
}
.input-group label {
    width: 140px;
    color: #e0e0e0;
    font-weight: 500;
    font-size: 14px;
}
.input-group input, .input-group select {
    padding: 10px 12px;
    width: 160px;
    background: rgba(95, 95, 95, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 8px;
    color: #ffffff;
    transition: all 0.3s ease;
    font-size: 14px;
}
.input-group select {
    appearance: none;
    background-image: url('data:image/svg+xml;utf8,<svg fill="%23e0e0e0" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
    background-repeat: no-repeat;
    background-position: right 8px center;
    background-size: 16px;
    padding-right: 35px;
}
.input-group input:focus, .input-group select:focus {
    border-color: #667eea;
    outline: none;
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
    background: rgba(95, 95, 95, 0.8);
}
button {
    padding: 12px 24px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
    transition: all 0.3s ease;
    margin-right: 10px;
    box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
}
button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
    background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
}
button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
}
textarea {
    width: 97%;
    height: 300px;
    background: rgba(46, 46, 46, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 8px;
    color: #e0e0e0;
    padding: 12px;
    resize: none;
    overflow-y: auto;
    font-family: 'Courier New', monospace;
    font-size: 13px;
    line-height: 1.5;
}
canvas {
    width: 100% !important;
    height: 300px !important;
    background: transparent;
    border-radius: 8px;
}
#stopwatch-display {
    font-family: 'Courier New', monospace;
    font-size: 20px;
    font-weight: bold;
    color: #FFD700;
    background: rgba(26, 26, 26, 0.8);
    padding: 8px 15px;
    border-radius: 8px;
    border: 2px solid rgba(255, 215, 0, 0.3);
    min-width: 90px;
    text-align: center;
    box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
}
#startStopBtn.running {
    background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    animation: pulse 2s infinite;
}
@keyframes pulse {
    0%, 100% { box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4); }
    50% { box-shadow: 0 4px 25px rgba(245, 87, 108, 0.6); }
}
#resetBtn {
    background: linear-gradient(135deg, #6c757d 0%, #495057 100%);
}
.status {
    position: fixed;
    top: 20px;
    right: 20px;
    padding: 15px 25px;
    border-radius: 8px;
    font-weight: 500;
    z-index: 1000;
}
.status.success {
    background: linear-gradient(135deg, #00b09b, #96c93d);
    color: white;
    box-shadow: 0 4px 20px rgba(0, 176, 155, 0.4);
    animation: slideIn 0.3s ease;
}
.status.error {
    background: linear-gradient(135deg, #ff416c, #ff4b2b);
    color: white;
    box-shadow: 0 4px 20px rgba(255, 65, 108, 0.4);
    animation: slideIn 0.3s ease;
}
@keyframes slideIn {
    from { transform: translateX(400px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
}
@keyframes slideOut {
    from { transform: translateX(0); opacity: 1; }
    to { transform: translateX(400px); opacity: 0; }
}
::-webkit-scrollbar { width: 10px; }
::-webkit-scrollbar-track { background: rgba(42, 42, 42, 0.5); border-radius: 5px; }
::-webkit-scrollbar-thumb { background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 5px; }
    </style>
</head>
<body>
    <div id="status"></div>
    <div class="container">
        <div class="panels">
            <div class="input-section">
                <h2>Nhập Dữ Liệu Fitness</h2>
                <div class="input-group">
                    <label>Ngày tập:</label>
                    <input type="date" id="date">
                </div>
                <div class="input-group">
                    <label id="morningLabel">Buổi Sáng:</label>
                    <input type="number" id="morning" min="0" step="0.1" value="0">
                </div>
                <div class="input-group">
                    <label id="afternoonLabel">Buổi Chiều:</label>
                    <input type="number" id="afternoon" min="0" step="0.1" value="0">
                </div>
                <div class="input-group">
                    <label>Loại:</label>
                    <select id="type">
                        <option value="Gập bụng - lưng">Gập bụng - lưng</option>
                        <option value="Gập bụng - chân">Gập bụng - chân</option>
                        <option value="Tập tay">Tập tay</option>
                        <option value="Hít đất">Hít đất</option>
                        <option value="Plank">Plank</option>
                        <option value="Tập chân">Tập chân</option>
                        <option value="Nhảy tại chỗ">Nhảy tại chỗ</option>
                    </select>
                </div>
                <button onclick="addData(event)">Add Data</button>
                <div class="input-group" id="stopwatch-group" style="display: none;">
                    <label>Thời gian:</label>
                    <span id="stopwatch-display">00:00</span>
                </div>
                <div class="input-group" id="stopwatch-controls" style="display: none;">
                    <label style="width: auto; margin-right: 5px;">Buổi:</label>
                    <select id="sessionSelect">
                        <option value="morning">Sáng</option>
                        <option value="afternoon">Chiều</option>
                    </select>
                    <button id="startStopBtn">Start</button>
                    <button id="resetBtn">Reset</button>
                </div>
                <div class="input-group">
                    <label>Năm:</label>
                    <select id="year" onchange="updateCharts()">
                        <option value="2025" selected>2025</option>
                        <option value="2026">2026</option>
                    </select>
                </div>
            </div>
            <div class="textarea-section">
                <h2>Dữ Liệu Fitness (Text)</h2>
                <textarea id="dataText"></textarea>
            </div>
        </div>
        <div class="chart-section"><h2>Gập bụng - lưng</h2><canvas id="absBackChart"></canvas></div>
        <div class="chart-section"><h2>Gập bụng - chân</h2><canvas id="absLegChart"></canvas></div>
        <div class="chart-section"><h2>Tập tay</h2><canvas id="armsChart"></canvas></div>
        <div class="chart-section"><h2>Hít đất</h2><canvas id="pushUpChart"></canvas></div>
        <div class="chart-section"><h2>Plank</h2><canvas id="plankChart"></canvas></div>
        <div class="chart-section"><h2>Tập chân</h2><canvas id="legChart"></canvas></div>
        <div class="chart-section"><h2>Nhảy tại chỗ</h2><canvas id="jumpChart"></canvas></div>
    </div>

<script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-database.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDOZFoWsx1s6xoowfekjnr0aD2n3z7PzMU",
  authDomain: "fitnesstracker-61e7a.firebaseapp.com",
  databaseURL: "https://fitnesstracker-61e7a-default-rtdb.firebaseio.com",
  projectId: "fitnesstracker-61e7a",
  storageBucket: "fitnesstracker-61e7a.firebasestorage.app",
  messagingSenderId: "432237908319",
  appId: "1:432237908319:web:15927471d97cef4f8f26ea",
  measurementId: "G-H0VQ7GJLLH"
};
firebase.initializeApp(firebaseConfig);

let fitnessData = [];
let stopwatchInterval = null;
let stopwatchTime = 0;
let isRunning = false;

function showStatus(message, isError = false) {
    const status = document.getElementById('status');
    status.textContent = message;
    status.className = 'status ' + (isError ? 'error' : 'success');
    setTimeout(() => {
        status.style.animation = 'slideOut 0.3s ease';
        setTimeout(() => status.textContent = '', 300);
    }, 3000);
}

function getCurrentDateVN() {
    const now = new Date();
    const vnTime = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Ho_Chi_Minh' }));
    const year = vnTime.getFullYear();
    const month = String(vnTime.getMonth() + 1).padStart(2, '0');
    const day = String(vnTime.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
}

function generateLabels(year) {
    return Array.from({ length: 365 }, (_, i) => {
        const d = new Date(year, 0, 1);
        d.setDate(d.getDate() + i);
        return d.toISOString().split('T')[0];
    });
}

const chartConfig = {
    type: 'bar',
    options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
            x: {
                title: { display: true, text: 'Ngày', color: '#e0e0e0', font: { size: 16 } },
                ticks: {
                    callback: function(value, index) {
                        const year = parseInt(document.getElementById('year').value);
                        const date = new Date(year, 0, 1);
                        date.setDate(date.getDate() + index);
                        return date.getMonth() + 1;
                    },
                    maxTicksLimit: 12,
                    color: '#e0e0e0',
                    font: { size: 16 }
                },
                grid: { color: '#444' }
            },
            y: {
                title: { display: true, text: 'Số Lần', color: '#e0e0e0', font: { size: 16 } },
                beginAtZero: true,
                stacked: true,
                ticks: { color: '#e0e0e0', font: { size: 16 } },
                grid: { color: '#444' }
            }
        },
        plugins: { legend: { labels: { color: '#e0e0e0', font: { size: 16 } } } }
    }
};

const charts = {};
['absBackChart', 'absLegChart', 'armsChart', 'pushUpChart', 'plankChart', 'legChart', 'jumpChart'].forEach((id, idx) => {
    const names = ['Gập bụng - lưng', 'Gập bụng - chân', 'Tập tay', 'Hít đất', 'Plank', 'Tập chân', 'Nhảy tại chỗ'];
    const config = JSON.parse(JSON.stringify(chartConfig));
    config.data = {
        labels: generateLabels(2025),
        datasets: [
            { label: 'Buổi Sáng', data: Array(365).fill(0), backgroundColor: '#FFD700', stack: 'Stack 0' },
            { label: 'Buổi Chiều', data: Array(365).fill(0), backgroundColor: 'blue', stack: 'Stack 0' }
        ]
    };
    if (names[idx] === 'Plank') {
        config.options.scales.y.title.text = 'Giây';
    }
    charts[names[idx]] = new Chart(document.getElementById(id).getContext('2d'), config);
});

function updateStopwatchDisplay() {
    const min = Math.floor(stopwatchTime / 60);
    const sec = stopwatchTime % 60;
    document.getElementById('stopwatch-display').textContent = 
        `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
}

function startStopwatch() {
    const btn = document.getElementById('startStopBtn');
    if (isRunning) {
        clearInterval(stopwatchInterval);
        isRunning = false;
        btn.textContent = 'Start';
        btn.classList.remove('running');
        const session = document.getElementById('sessionSelect').value;
        document.getElementById(session).value = stopwatchTime;
        showStatus(`Đã dừng! ${stopwatchTime}s (${session === 'morning' ? 'Sáng' : 'Chiều'})`);
    } else {
        stopwatchInterval = setInterval(() => {
            stopwatchTime++;
            updateStopwatchDisplay();
        }, 1000);
        isRunning = true;
        btn.textContent = 'Stop';
        btn.classList.add('running');
    }
}

function resetStopwatch() {
    clearInterval(stopwatchInterval);
    stopwatchTime = 0;
    isRunning = false;
    updateStopwatchDisplay();
    document.getElementById('startStopBtn').textContent = 'Start';
    document.getElementById('startStopBtn').classList.remove('running');
}

document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('date').value = getCurrentDateVN();
    
    document.getElementById('type').addEventListener('change', function() {
        const isPlank = this.value === 'Plank';
        document.getElementById('stopwatch-group').style.display = isPlank ? 'flex' : 'none';
        document.getElementById('stopwatch-controls').style.display = isPlank ? 'flex' : 'none';
        document.getElementById('morningLabel').textContent = isPlank ? 'Buổi Sáng (giây):' : 'Buổi Sáng:';
        document.getElementById('afternoonLabel').textContent = isPlank ? 'Buổi Chiều (giây):' : 'Buổi Chiều:';
        document.getElementById('morning').step = isPlank ? '1' : '0.1';
        document.getElementById('afternoon').step = isPlank ? '1' : '0.1';
        if (isPlank) {
            const hour = new Date().getHours();
            document.getElementById('sessionSelect').value = hour < 12 ? 'morning' : 'afternoon';
        }
        loadDataForDate();
    });
    
    document.getElementById('startStopBtn').addEventListener('click', startStopwatch);
    document.getElementById('resetBtn').addEventListener('click', resetStopwatch);
    document.getElementById('date').addEventListener('change', loadDataForDate);
});

function loadDataForDate() {
    const date = document.getElementById('date').value;
    const type = document.getElementById('type').value;
    if (!date || !type) return;
    
    firebase.database().ref("fitnessEntries").orderByChild("date").equalTo(date).once("value")
        .then(snapshot => {
            let morning = 0, afternoon = 0;
            snapshot.forEach(child => {
                if (child.val().type === type) {
                    morning = child.val().morning || 0;
                    afternoon = child.val().afternoon || 0;
                }
            });
            document.getElementById('morning').value = morning;
            document.getElementById('afternoon').value = afternoon;
            if (type === 'Plank') {
                const session = document.getElementById('sessionSelect').value;
                stopwatchTime = Math.round(parseFloat(document.getElementById(session).value) || 0);
                updateStopwatchDisplay();
            }
        });
}

function addData(event) {
    const date = document.getElementById('date').value;
    let morning = parseFloat(document.getElementById('morning').value) || 0;
    let afternoon = parseFloat(document.getElementById('afternoon').value) || 0;
    const type = document.getElementById('type').value;
    
    if (!date || !type) {
        showStatus('Vui lòng chọn ngày và loại tập!', true);
        return;
    }
    
    if (type === 'Plank') {
        morning = Math.round(morning);
        afternoon = Math.round(afternoon);
    }
    
    const btn = event.target;
    btn.disabled = true;
    btn.textContent = 'Đang lưu...';
    
    const db = firebase.database().ref("fitnessEntries");
    db.orderByChild("date").equalTo(date).once("value")
        .then(snapshot => {
            const deletes = [];
            snapshot.forEach(child => {
                if (child.val().type === type) {
                    deletes.push(child.ref.remove());
                }
            });
            return Promise.all(deletes);
        })
        .then(() => db.push({ date, morning, afternoon, type }))
        .then(() => {
            showStatus("Đã lưu thành công!");
            document.getElementById('morning').value = '';
            document.getElementById('afternoon').value = '';
            if (type === 'Plank') resetStopwatch();
            return fetchFirebaseData();
        })
        .then(() => {
            document.getElementById('date').value = getCurrentDateVN();
            btn.disabled = false;
            btn.textContent = 'Add Data';
        })
        .catch(err => {
            console.error(err);
            showStatus("Lỗi khi lưu!", true);
            btn.disabled = false;
            btn.textContent = 'Add Data';
        });
}

function fetchFirebaseData() {
    return firebase.database().ref("fitnessEntries").once("value")
        .then(snapshot => {
            let dataText = '';
            fitnessData = [];
            snapshot.forEach(child => {
                const { date, morning, afternoon, type } = child.val();
                fitnessData.push({ date, morning, afternoon, type });
                dataText += `${date},${morning},${afternoon},${type}\n`;
            });
            document.getElementById('dataText').value = dataText;
            updateCharts();
        });
}

function updateCharts() {
    const types = ['Gập bụng - lưng', 'Gập bụng - chân', 'Tập tay', 'Hít đất', 'Plank', 'Tập chân', 'Nhảy tại chỗ'];
    const year = parseInt(document.getElementById('year').value || 2025);
    const startDate = new Date(year, 0, 1);
    
    types.forEach(type => {
        charts[type].data.labels = generateLabels(year);
        const morningData = Array(365).fill(0);
        const afternoonData = Array(365).fill(0);
        fitnessData.forEach(item => {
            if (item.type === type) {
                const itemDate = new Date(item.date);
                const dayIndex = Math.floor((itemDate - startDate) / (1000 * 60 * 60 * 24));
                if (dayIndex >= 0 && dayIndex < 365) {
                    morningData[dayIndex] = item.morning;
                    afternoonData[dayIndex] = item.afternoon;
                }
            }
        });
        charts[type].data.datasets[0].data = morningData;
        charts[type].data.datasets[1].data = afternoonData;
        charts[type].update('none');
    });
}

window.addEventListener("load", () => {
    fetchFirebaseData();
    updateStopwatchDisplay();
});
</script>
</body>
</html>
